name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test tooling
        run: |
          python -m pip install --upgrade pip build twine pytest pytest-timeout
          pip install -e ".[sign]"
      - name: test
        run: pytest tests/ -q --timeout=120 --timeout-method=thread
      - name: build immutable artifact
        run: python -m build --wheel --outdir dist
      - name: inspect artifact
        run: |
          python -m twine check dist/*
          python scripts/verify_artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: homestead-release-${{ github.ref_name }}
          path: |
            dist/*
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      # MUST come before download-artifact: actions/checkout cleans the workspace by
      # default, so running it second would delete the dist/ we just downloaded.
      # This job had no checkout at all, so `mcp-publisher publish` ran in an empty
      # workspace and died with "server.json not found" AFTER PyPI had already
      # published. Caught on v0.3.2, which was the first tag to actually contain the
      # registry step (v0.3.1 was tagged before it existed, so its green tick meant
      # "the step is absent", not "the registry is up to date").
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homestead-release-${{ github.ref_name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/homestead_memory-*.whl
          generate_release_notes: true
      # MCP registry listing, published from CI so it cannot drift from a release.
      # Runs AFTER the PyPI upload: the registry verifies the package exists and that
      # its description carries the `mcp-name:` ownership marker.
      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # PyPI's CDN lags its own API, so publishing immediately makes the registry
          # reject a package it cannot see yet. Wait for it rather than guess a sleep;
          # observed lag on 0.3.1 was roughly a minute.
          GOT=""
          for i in $(seq 1 20); do
            GOT=$(curl -sf "https://pypi.org/pypi/homestead-memory/${VERSION}/json" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' \
                  2>/dev/null || true)
            [ "$GOT" = "$VERSION" ] && { echo "pypi is serving ${VERSION}"; break; }
            echo "waiting for pypi to serve ${VERSION} (attempt ${i})"
            sleep 15
          done
          [ "$GOT" = "$VERSION" ] || { echo "::error::pypi never served ${VERSION}"; exit 1; }

          URL=$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
                | python3 -c 'import json,sys; print(next(a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if "linux_amd64" in a["name"]))')
          curl -sL "$URL" | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      # Deliberately NOT continue-on-error. A green release with a stale registry entry
      # is exactly the silent-success failure this project keeps having to fix.
  canary:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: vps-canary
    steps:
      - name: Canary deploy to an isolated VPS (optional; skips cleanly when unconfigured)
        env:
          DEPLOY_HOST: ${{ secrets.HOMESTEAD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HOMESTEAD_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.HOMESTEAD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMESTEAD_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice title=Canary skipped::No VPS deploy secrets configured; this optional post-publish smoke deploy is disabled."
            echo "This workflow is a template. It never contains server details — it only reads private repository secrets at run time."
            echo "To enable the canary, add these repository secrets (Settings > Secrets and variables > Actions):"
            echo "  - HOMESTEAD_DEPLOY_HOST"
            echo "  - HOMESTEAD_DEPLOY_USER"
            echo "  - HOMESTEAD_DEPLOY_SSH_KEY"
            echo "  - HOMESTEAD_DEPLOY_KNOWN_HOSTS"
            echo "Then provide the adapter described in deploy/canary/README.md."
            exit 0
          fi
          echo "VPS deploy secrets present. The configured adapter runs deploy/canary/deploy.sh, health_gate.sh, and keeps rollback evidence."
